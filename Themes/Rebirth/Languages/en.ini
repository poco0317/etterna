HowToCreateCharts=Create documents
HowToCreateChartsShortDescription=Notes for calculation
HowToCreateChartsDescription=You need an author. Eterna does not currently come with an editor. Popular options are ArrowVortex and DDReam. Others also choose to use an osu converter or older SM3/SM5 converters.\n\nWhat’s important is that you have a way to convert submissions and bring them to the appropriate extension such as .sm.\n\nA shortcut just needs the icon and the extension file (.sm for example) to unload. Be careful not to attempt to patch the board before these two are in your Etterna Songs collection.\n\nNumerous tutorials on graphic design are available online, and most people are willing to help if you ask around.
HowToManualSongInstall=Installing the song manually
HowToManualSongInstallShortDescription=When you publish in a client it's not your
HowToManualSongInstallDescription=Here’s the deal: You’ve composed or produced a song or a piece of music. Now you need to make them replayable in the game.\n\nIdeally, the controls are structured in the following directory - /PartName/SongName/stuff.sm.\n\nIf this applies to a profile you just downloaded, all you need to do is copy the profile text and drop it into your Songs folder. The image is /Songs/BundleName/SongName/stuff.sm\n\nIf you have the same song, you need to create a new picklist for it in the Songs folder. It can have any name. Once all of that is done, either open the game again or press Ctrl + Q in SelectMusic.\n\nIf for some reason you want to keep your setup separate from your songs, open Preferences.ini and add a direct path to the new songs folder in the AdditionalSongFolders field.
HowToDownloadPacks=Destroy the bottles
HowToDownloadPacksShortDescription=How to Press Keyboard
HowToDownloadPacksDescription=Ingame, branching is pretty easy. If you don’t have decks installed, you may first be directed to the line deck selection screen that shows a few different difficulty options to get you started.\n\nIf you skip this, don’t want the options, or already have something installed, you can use the custom mode in SelectMusic. On the top right, in the Ctrl + 3 menu, you should find every package you can download from ingame. If this screen is dark, you may not have an internet connection.\n\nThere are other sources of ferns if these tablets ever fail that you should ask around.\n\nDownloaded packages will extract and install automatically when finished. If it appears that they have clicked but nothing happens, it may not be possible to unlock instead.
HowToSongSearch=Looking for a song
HowToSongSearchShortDescription=song exit
HowToSongSearchDescription=You may be looking forward to being able to search for a song you haven’t installed. Let's get this out of the way first - it's not currently possible from within the client.\n\nYou can search for embedded songs using the F1 menu (left button at the top of SelectMusic). The interface should be simple to use. Just fill in the fields you like and hit enter, and the results will come to you.\n\nOtherwise, sites that host components can provide research opportunities.
HowToSongFilter=The song is beautiful
HowToSongFilterShortDescription=Filter songs
HowToSongFilterDescription=The song filter is integrated with the song search. It can be found in the F1 menu (left panel at the top of SelectMusic).\n\nThere isn’t currently any keyboard shortcut with the menu, but the shortcuts should be enough to let you enable a filter with your mouse. A slider placed at the far end is considered by default 0 or infinite, an invalid range.\n\nFilters work if you happen to save a song and return, unlike a song search.
HowToSortmode=Selection procedures
HowToSortmodeShortDescription=Share the songs
HowToSortmodeDescription=The technique of this song can be used in many of the ways already listed.\n\nTry tapping up down in the main area, and your wheel will switch to a menu to choose a custom option. Some people will find some types more useful than others.\n\nGroup silence is often used because it is a natural process that everyone expects. Some content is for informational purposes.\n\nIf you want to change the behavior of these types, see the implementation in the Code Editor/WheelDataManager.
HowToCustomizeGameplay=Update the game
HowToCustomizeGameplayShortDescription=The power in the palms of your hands
HowToCustomizeGameplayDescription=Customize Gameplay is a gaming screen that allows you to change every element on the screen in almost any way to make it your own.\n\nOn the right side there is a navigation bar and information that can be pulled out for viewing. Plot options can be used if no object is selected.\n\nEnter to select the displayed item, or click the item to select it. Use the position to change which type of movement you are changing (arrows vs. weights). Some branches do not offer more than one species. A mouse can be used to test any hypothesis.\n\nHold shift to move in smaller increments. Use RestartGameplay to toggle or hold down Ctrl with it to restart the game.\n\nAll changes are saved to the disk as soon as you exit the site.
HowToUpdate=Etterna Update
HowToUpdateShortDescription=Backing up your user data
HowToUpdateDescription=Updating to Etterna is painless on all platforms. In all cases, we would recommend you to take a backup copy of any content you have added directly into the game - Noteskins, Save, Assets. Songs do not need to be backed up.\n\nOn Windows, the installer may ask you to uninstall an older version, and the installer may crash. It’s safe to ignore this. As long as you don’t directly swap a more recent version over an older one, your new installation will work fine.\n\nOn a Mac, updating is simply reinstalling the game again, but with fewer updates.\n\nOn Linux, upgrading can be going through the latest repository or a git pull and rebuild.\n\nThe most important screen you don’t want to miss is the Full Save screen. Almost every file on this list is related to user goals or needs in some way.
HowToSetSync=Install Download/Update
HowToSetSyncShortDescription=The notes follow the music, you know
HowToSetSyncDescription=Every player is going to have an issue at some point that manifests in their offensive reactions being generally late or generally slow. This is translated in the sense of the end or of the past. In each scenario, the slope or negative mean indicates a 'statement.'\nIf you are suffering from unwritten slowness or bad balance with slow speed (> 510ms +/-) here are a few things to try.\nEterna offers motion reduction (also called judge reduction), digital (machine) reduction, and song reduction. The offset of a song is determined by each copywriter, and if it ever ends up wrong, that tends to be their fault and not yours.\nVisual optimization expands the visual space where the perfect footprint becomes the focus of your customers. To change it, find it in the F3 menu or SelectMusic properties.\nGlobal offset applies to all tracks in addition to the song offset. It changes the listening position by moving the headphones. Ideally, it’s 0ms, but it may be non-zero if you have any audio/video/input related inconsistencies.\nWorld and song settings can be set automatically by going into a song and pressing F6, then playing as long as you can. Try not to let the autosync go for more than 2 cycles.\nYou can also try moving them manually with F11/F12.
HowToChangeTheme=Change the topic
HowToChangeThemeShortDescription=It's not called hope
HowToChangeThemeDescription=The general look of the game is called the Theme. Most of it is written in Lua.\n\nTo install a theme, you simply download its content into the Themes folder of your installation. There is no need to default to this code.\n\nTo change your theme, you can find the option in the SelectMusic settings, or in Recording Options. Doesn't look like this theme though.
HowToChangeLanguage=Change the language
HowToChangeLanguageShortDescription=We don't need translators
HowToChangeLanguageDescription=エトナは、いくつかの主要言語への正確な翻訳を行っていますが、全体的に、どれも私たちの意志に感謝するためにアクセスすることはありません。\n\n翻訳のアイデアは常に私たちの頭の中にありますが、優先順位はあまり高くありません。\n\n変更された言語とそれが見える方法で見て、録音オプションまたはselectmusic設定でそれを見つけた
HowToToggleMenuSound=Change menu options
HowToToggleMenuSoundShortDescription=sound
HowToToggleMenuSoundDescription=Sometimes the menu tone is annoying.\n\nTo turn them off, press Pause on your keyboard, or find the option in the menu F3 page F5 or in the SelectMusic keyboards.
HowToTogglePitchRates=Change the sound effects
HowToTogglePitchRatesShortDescription=Night Remix
HowToTogglePitchRatesDescription=Some players like a higher pitched sound than others, and some players like it when the song is sustained but not too loud.\n\nTo enable the speaker on the cables, find it in the F3 F8 menu, Advanced Options, or Music Preferences settings.
HowToSwapWheelSide=Transfer of Strategic Plans
HowToSwapWheelSideShortDescription=Change is not good
HowToSwapWheelSideDescription=Understandably, some people were left unhappy with the fact that the wheel scrolls left side in Rebirth.\n\nTo switch fields, find the cargo position option in SelectMusic settings > Fields > Theme Options.
HowToLogin=submission
HowToLoginShortDescription=Online Communication Use
HowToLoginDescription=Login is required if you ever want to upload results or view leaderboards.\n\nTo start the uninstall process, you either click the broken link in the upper left or press Ctrl + L while in SelectMusic. If you do the same again, he will release you.\n\nLogging in this way is not required to play multiplayer. Instead, you are separately asked to enter this, if necessary.
HowToUpload=Enter the results
HowToUploadShortDescription=Flex your 89% while playing
HowToUploadDescription=You must first log in to upload any level.\n\nEach time you log in (and if you log in automatically at the beginning of a session) Etterna will attempt to disable any goals you set. Scores will also attempt to load immediately after you set scores, even before your profile saves.\n\nOnly targets of higher frequencies will be adjusted. You can check if a document is loaded by checking its prefix labels in the scores table.\n\nTo try to force reset, find the move buttons in either the browser window or the goals pane.We added move items into the list, so there is no obvious progress marker. Just trust.\n\nScores with a value of 0.00 or those that are not significant are invalid.
HowToFavoriteSongs=That is I favorite song
HowToFavoriteSongsShortDescription=Earwigs
HowToFavoriteSongsDescription=Your library of songs can become huge and Favoriting is a way to keep track of the files you really like. Just press Ctrl + F on a folder and it will become a Favourite. Do the same again to remove it.\n\nThe choices can be viewed as a playlist or in the choices management window if you press UpDown-UpDown.
HowToPermamirror=Permanent mirror plates
HowToPermamirrorShortDescription=Hand control is bad
HowToPermamirrorDescription=Some charts out there are biased towards one hand, and some players have particularly bad hands. Because Etterna's judgment on the difficulty of sorting and the resolution of the board is still there because of just swapping hands, sorting is an important part of the game and is secondary.\n\nSome decks may need constant editing for some players, but players may not want to leave the mirror for anything. Permamirror is the solution.\n\nTo change the permanent mirror in a window, hover over it and press Ctrl + M. Every time you open it, the mirror will be dark.
HowToPlayOsuCharts=Play Osu schedule in Etterna
HowToPlayOsuChartsShortDescription=that person is daniel
HowToPlayOsuChartsDescription=Eterna has built-in support for playing osu files. Files encrypted with Osu software usually come in .osz format, which must be extracted before Etterna can read them.\n\nChange the file extension to .zip and extract the files using your favorite tool. You will be presented with a folder containing the audio file, a shortcut, and one or more .osu files.\n\nThis template represents all the choices of a playlist, and only needs to be added to the playlist of songs itself or to the choices list.\n\nIf you are not familiar with manual playback, see the help entry "Manual playback".
AboutKeymodes=About key types
AboutKeymodesShortDescription=recipes, recipes recipes, recipes recipes, Games ...
AboutKeymodesDescription=At its core, the game is an amalgamation of several other real-world games. This is why keymodes are separated by Game and then by Style.\n\nDance - Basic game. 4k. The dance-double can be found here, and it’s 8k. Also included is a 3k format.\nSolo - Separate from the base game, 6k.\nBeat - Play BMS. 5k+1, 7k+1, and multiples for both.\nKb7 - An unreleased gamemode, 7k.\nPump - 5k, 6k, and 10k in single, half round, and double round.\nPop - Yes, pop. 5k and 9k.\n\nWithin the game, each style appears on difficulty icons. You can change the game in the SelectMusic settings or in the Select Game icon in Options.
AboutCleartypes=on the obvious type
AboutCleartypesShortDescription=The MF Miss Stadium
AboutCleartypesDescription=Levels were determined by methods called cleartypes. They are methods of improving the quality of your rankings at a glance. You are only given 1 type of shade per row.\n\nMFC - Amazing Full Combo - Everything Amazing\nWF - White Flag - All interesting but 1 Perfect\nSDP - single digit perfects - interesting and just perfect, but no more than 9 perfects\nPFC - Full Combo - Everything is amazing and perfect\nBF - Black Theme - All are amazing and Perfect, but 1 is Great\nSDG - Single Digit Adults - Full diversification, but no more than 9 adults\nFC - Full Combo - no combo bosses, such as damage, damage, rush, or hold thrown\nMF - Miss Flag - Almost fully customizable: 1 customizable cutter\nSDCB - Single Digit Combo Pieces - Almost Full Combo: Up to 9 Combo Pieces\nclear - you passed\nYou don't know - You don't know
LegacyKeyConfig=The old key page
LegacyKeyConfigShortDescription=You are a shoulde needed that
LegacyKeyConfigDescription=Old key config can still be accessed via main menu items. The left half of the screen is where the relevant controls are located - this is the direction of Player 1. The right half is Player 2's, but now the controls are dead. The default settings cannot be changed directly.\n\nTo turn the remote control off, turn the key to a different button on the right side that is not frequently used.\n\nIf you just used the restart option in Rebirth, you don’t have to use this option.\n\nPlease note - just because this mode allows you to connect a single pad to multiple lights to play with doesn't mean setting targets using that type of setup is allowed. This feature is more designed for people with a play style or retention.
ReplayInfo=Restart
ReplayInfoShortDescription=The city of rz
ReplayInfoDescription=Local and online trials can be viewed for targets where appropriate trial data are available.\n\nLocal streaming clips can be viewed if the clips are in Replays or ReplaysV2. You need to find the score in the scoreboard, and then click the button to see the replay.\n\nListing attempts can be viewed directly from the leading screens above.\n\nWhile on replay, you can pause and exchange goods or search around. A great completion letter can be used as a research letter.\n\nThe analysis will show a reconstruction of the actual flow display signal.
SelectMusicTips=Select Music Instructions
SelectMusicTipsShortDescription=A quick entry into the menu
SelectMusicTipsDescription=SelectMusic has a long list of shortcuts that allow easy navigation. Memorizing many of these will go a long way. Find that page in the SelectMusic settings to learn more.\n\nSome parts of the UI have extra mouse functionality. Clicking on a wheel head will quickly select a band or song in the current group. Clicking any text on the Main page of the browser window changes the displayed information. If you click on the song bank, it will open the profile link.\n\nThe music wheel scroll button can be pressed or dragged to fast-forward through songs. The right-click buttons in the browser window will launch them.\n\nEscape is a very useful button for exiting the side menus that appear when using the buttons at the bottom of the screen.
ProfileTab=Using the Profile Tab
ProfileTabShortDescription=Your content is you
ProfileTabDescription=The Profile tab contains a lot of important information about your game’s usage and goals. The Overall section provides insight into the inclusion and exclusion criteria as well as general trends. Here, you can either load all results (not ranked) or load all results locally. You can also click the Player Notes list to change it to Player Notes for more information.\n\nIn the latest Goals View console, or in any of the other widgets, you can see how many hundreds of your goals are organized in a certain way that the widget is known for.Stream example lists everything by stream. The final scores were sorted by date.
GoalsTab=Using the Scores Table
GoalsTabShortDescription=Try to be positive eventually
GoalsTabDescription=The Goals tab contains a list of goals you’ve created on the screens that you’d like to eventually achieve. This is the meaning of purpose. By default, all scores start at stage 1, cost 1x, and 93%. These characteristics can be manipulated to increase or decrease them.\n\nTo create a goal, there is a button for it on the screen or you can use Ctrl + G.\n\nThe right-click buttons are for sorting the target list. The right-side button filters the report by progress status.\n\nAn empty goal simply means that the goal doesn’t make sense because you’ve already set a price that exceeds it. Remove it or set a higher target.\n\nTargets are stored in your XML.
PlaylistsTab=Using the Music Playlists tab
PlaylistsTabShortDescription='Lessons'
PlaylistsTabDescription=The Playlists tab allows you to create multiple playlists of playlists to play or replay. These don't actually have to be used to play in sequence as a course, but can be options for files.\n\nTo create a playlist, you can either use Ctrl + P or use the New Playlist text box. Then, click the app name to import it.\n\nTo add notes to the selected playlist, use Ctrl + A or click the Add Current Notes button. The rate at which a note is played in the course music can be changed by clicking Rate in the Properties menu.\n\nThe original playlist cannot be replayed.\n\nSheet music is stored in your XML.
TagsTab=Tags Tab Usage
TagsTabShortDescription=Explain your schedule
TagsTabDescription=The Tags tab allows you to place custom tags on posts so you can describe them in your own way or filter based on tags.\n\nAny number of dimensions can be assigned to a sequence. The selected methods (to a certain extent) will appear in the General window, and also as a different color in the Conditions tab.\n\nThe Require Tag tab places a filter on all titles that require a tag to be assigned. The Hide Tag button does the opposite - any song with that tag is invisible. You must click Apply to apply these filters.\n\nTo assign tags to a scene, just click the Assign button and then click any tags.\n\nDeleting a tag is a 2-step process that starts with the Delete button.\n\nThe Reset button resets all filters. It does not remove any symptoms.\n\nTags are stored in a tags.lua file that can be shared with other people.
GettingSupport=Get help
GettingSupportShortDescription=Not for drinking coffee
GettingSupportDescription=Sometimes converting Etterna or converting things is not an easy task. Well … it is for many of us, but not for everyone.\n\nSince many people know the solutions to many complex issues, if you ever need help, you are free to ask in the Etterna regions for help. Github Issues (can be found on the Title Screen) is a place to send bugs, not request support.\n\nDiscord servers that have the answers to your questions can be found on the front page of the Github repository, or on any website related to the game.
Softlocked=It connects quickly
SoftlockedShortDescription=linked in
SoftlockedDescription=On some rare occasions, not least in Rebirth, the game can lock but it’s not a forceful crash or crash. You can say that it’s the same if some controls can work, but you can’t rewind or rewind or go back.\n\nThe default temporary solution is Ctrl + Operator. By default, the viewer is set up by entering the register. It can be configured in the config of the old device. Pressing this combo will move you to the options menu.\n\nF3 + F8 + 9 will put you back into the old device config.\n\nIf you ever end up in softlock mode, it’s helpful to be able to reference it and then describ
InputBroke=All access is disconnected
InputBrokeShortDescription=The fight just laughs at you
InputBrokeDescription=Rebirth has a few software bugs that can in one way or another cause your fighting system to stop working altogether or malfunction.\n\nTo solve this, you can first try escaping to the main palace. If it doesn't work or you already are, try reloading the keys and then the keys - Ctrl + F2 and then Ctrl + Shift F2. Then rotate the screen by pressing F3 + F6 + 2.\n\nIf you ever end up in this situation, it will be very helpful to bring it up.
GeneralTips=General Instructions
GeneralTipsShortDescription=Disk Repair
GeneralTipsDescription=A lot of weird things happen in this game. Here are a few things to try before you cry over it.\n\nBirth bugs, formatting issues, and error spam can be easily resolved usually by redesigning the site, icons, and current layout. Ctrl + F2 > Ctrl + Shift F2 > F3 + F6 + 2. When expanding on this topic in particular, you’ll want to know this shortcut.\n\nCtrl + Operator or F3 + F8 + 9 will launch you out of any terminal.\n\nIf the output or graphics doesn’t work for some reason, a reboot is usually a fix.\n\nThe constant crash at startup is usually caused by putting overwhelming buffers in the trigger files or issues related to 0 BPM.
SongDoesntLoad=The song is not playing
SongDoesntLoadShortDescription=Mysterious
SongDoesntLoadDescription=Sometimes when creating illustrations, authors realize that the illustration they are working on does not appear. There is a reason for this (mostly bug)\n\nIf you insert music into a song folder without the .sm and restart or Ctrl + Q at any point, the clip is now permanently ignored as not being a song folder. The same applies if you put a .sm in that folder but it doesn't have charts.\n\nTo be safe, you should save the video with a .sm extension and a suitable extension before restoring or using Ctrl + Q. This will copy the new song for free.\n\nIf this situation ever arises, to resolve it you need to clear the Cache option or rename the song option.
SongDoesntUpdate=The song is not improving
SongDoesntUpdateShortDescription=When you don’t know the signs
SongDoesntUpdateDescription=When editing tracks, authors may run into an issue where the notedata they edit updates when they go to playtest, but the song ends early or abruptly. Or even one of the metadata changes with what they saved it for.\n\nThe reason for this is that the game has an incredibly reliable cache. It loads new notedata from the list when it enters the game, but it doesn't change the graphical elements based on that notedata.\n\nTo fix this, manually upload a song and press Ctrl + Shift + R. That will copy the song from the list.
ScoresDontSave=The results do not hold
ScoresDontSaveShortDescription=Toy animals or using a toy
ScoresDontSaveDescription=There are two scenarios you may find yourself in if the goals stop.\n\nThe usual one is that you accidentally run out of Save Scores. This is an option found somewhere in the menus. Normally it shouldn’t be done.\n\nAnother is a bug called 0x where on display suddenly your music value is set to 0x, and now the chances of the rest of the session not touching are very high. To save, just repeat.\n\nLast is a messy installation. You install in a location where you do not have read permissions, such as Program Files. Or you allocate disk space.
ScoresWorth0=Results with a significance level of 0.00
ScoresWorth0ShortDescription=Incorrect results
ScoresWorth0Description=The levels instantly become the value 0 when the level is not valid when created.\n\nConditions for unacceptable results:\nvariables not allowed (clear which ones are being used)\nfile contains less than 200 dots\nfail\nChord support on\nAutoplay or exercise
RandomCrashes=Shortness of breath
RandomCrashesShortDescription=This is the life
RandomCrashesDescription=Sometimes it impacts the game. Crashdumps should be generated in a folder within your Program folder.\n\nIf you choose to cheat, you just need to tell us in an issue or a post on Discord that you’re having scam problems. If not, you still need to let us know but make sure to provide us with the .dmp file and associated media.\n\nIf you continue to close for no apparent reason, it’s always good to raise an issue or ask the community what’s going on.

