RollAscending=Accumulation (1234)
RollAscendingShortDescription=It’s an obscure member
RollAscendingDescription=Roll is a general name given to this type of process that requires you to roll all blocks in sequence before repeating any blocks again. It comes in many forms.\n\nThe particular pattern shown here can be called a growing pattern. If she went the other way (4321) she would be hitting.\n\nThe direction of the roll does not affect its ability to be jumped. Only the speed of the roll does.
RollInward=Accumulation (1243)
RollInwardShortDescription=It’s an obscure member
RollInwardDescription=Roll is a general name given to this type of process that requires you to roll all blocks in sequence before repeating any blocks again. It comes in many forms.\n\nThe particular pattern shown here can be referred to as a split pattern. If the pattern starts with the rotation arm (4312) it will be a quality measurement.\n\nRegardless, this roll factor can be easily jumptrilled if its speed is high enough.
RollSplit=Accumulation (4132)
RollSplitShortDescription=For obscure reasons, it’s a squirrel
RollSplitDescription=Roll is a general name given to this type of process that requires you to roll all blocks in sequence before repeating any blocks again. It comes in many forms.\n\nThe particular rhythm shown here may be referred to as a split rhythm, a split hand rhythm, or a split trill. It can also start with the directional order (3241, inside out) but still remain a functional representation.\n\nThis roll variant is more difficult than others to jumptrill. When struck rapidly, it is physically similar to a split jumptrill.
Gluts=Animal
GlutsShortDescription=Another word for 'most'
GlutsDescription=The glutes is a broad term that includes both the drop and the abdominal muscles. There is often debate as to what constitutes sati or even if there is a handshake.\n\nThe most acceptable definition of a glute is pretty straightforward: The folds are a series of folds that form particularly small pockets while engaging the muscles at the end of the glute exercise.\n\nThe picture shows a chicken glut due to small problems in holes 1 and 4. Gluts are a subset of chordjacks with more emphasis on the jack action than the chords.
Chordjack=Kurdjack
ChordjackShortDescription=Things Jacks Does
ChordjackDescription=Chord jack is an umbrella term for all jacks that include an umbrella.\n\nThe lines in the new concept do not have to be the same. Jumps, hands, or quads are acceptable. The one shown to the right is a straight, hard-to-reach chord with just the hands.
DenseChordjack=Big Chordjack
DenseChordjackShortDescription=Don't lose your keyboard
DenseChordjackDescription=Dense chordjacks are the strength of chords that are triggered by the movement of the arms and chords. At high density, this can be called a holed-odge because when you read, there are more edges than edges.\n\nDense chordjacks require a lot of range and tend to have longjacks set up due to the fact that the process is almost all hands and quads.
Stream=Brook
StreamShortDescription=Single Complete Structures
StreamDescription=Like the name suggests, silver is a stone of complementary emotions. In general, these full runs are mostly in separate folds, forming no pockets. There can be all sorts of variations in the design as long as it doesn’t deviate too much from the clean design.\n\nMinijacks, chords, or other playable effects can be found within a track, but they only serve to flavor it further if they don’t dominate the overall effect.\n\nTo the right is a slightly meandering stream.
Jumpstream=jump
JumpstreamShortDescription=Travel by jumping
JumpstreamDescription=Jumpstream extends the definition of a stream by requiring a jump somewhere in the jump. Other than that, it still has a suction.\n\nShown to the right is a simple jump pattern with an anchor on hole 1. A more astute player might realize that this pattern can be missed in a maze.
Handstream=hand drain
HandstreamShortDescription=River with hands
HandstreamDescription=HandStream extends the definition of orientation by requesting a hand at a certain point within the frame. It’s also not uncommon to find cables embedded within a handset. This can be called a typical handshake, although all typical handshakes are just hands and a single finger.\n\nAnchors are more common in a handshake as the charter only has four ways to move the hand in four wings. In the direction of the right, there is a pool in the 4th section and, depending on who you ask, the 3rd section, too.
Quadstream=Four Rivers
QuadstreamShortDescription=Shooting with quads
QuadstreamDescription=Quadstream takes the definition of stream so far that it starts to sound like chordjacks.\n\nIt creates a minijack with a quad using a button (usually) and still flows like a river instead of pure chordjacks.\n\nIncreasing the polar density will suppress this property because of the limited contact space.
Trill=tuition
TrillShortDescription=Appreciation musical theory
TrillDescription=A trill is a continuous variation of two sound waves. In this type of game, they can be on the same hand or split between two hands.\n\nIf a trill is played with one hand, it is called a one-handed trill. Otherwise, it’s a two-handed trill. Trills are not restricted to only the top two frets, and can also be on frets 1 and 3 for example.\n\nHe is shown on the right with a simple two-handed grip.
Jumptrill=last
JumptrillShortDescription=He can play blind
JumptrillDescription=Jumptrill is a very simple extension of the two-handed trill. Jump on one hand, then jump on the other. Most often, this figure places the upper NPS section unless it has large chordjacks.\n\nA unique feature of the regular jumptrill is that most of the other notes can be grouped above the jumptrill, allowing for a more driven playing. We do not recommend doing this frequently due to your own personal preference and the formation of a habit.
SplitJumptrill=Share Jumptril [13][24]
SplitJumptrillShortDescription=Jump trill but tight
SplitJumptrillDescription=The Split Jumptrill is a common move. He performs two one-handed trills instead of a clean jumptrill.\n\nSplit jumptrills are very annoying due to many players being unable to hit them consistently. This particular variant of the split jumptrill can be more difficult than another variant of the split jumptrill because the player is more likely to trip or trip when simultaneously performing a one-way jumping movement with both hands. Luckily they can be jumbled if taken correctly.\n\nTo the right is a long separate swimming pool.
SplitJumptrillTrainTrack=Share Jumptril [14][23]
SplitJumptrillTrainTrackShortDescription=Jump trill but tight
SplitJumptrillTrainTrackDescription=The Split Jumptrill is a common move. He performs two one-handed trills instead of a clean jumptrill.\n\nSplit jumptrills are very annoying due to many players being unable to hit them consistently. Compared to the other split jumptrills, this one is usually easier because it can feel more natural. Anyways, they can be jumped if hit enough.\n\nTo the right is a long separate swimming pool.
Minijacks=Mini Jackets
MinijacksShortDescription=Temporal coupling interruption
MinijacksDescription=Minijacks are two. They can be continuous like the picture to the right or arranged in a pattern like a rose.\nMinijacks can be difficult to play consistently because they close together due to the shape of the beat surface. Imagine pressing a single key in 180ms. Now drop two needles into that same hole. If the minijack is spinning too fast or the player is moving too fast, missing notes are guaranteed.\nMinijacks can be connected in the same way as a controller. Most are isolated or on river views rather than trills.
Longjack=Long
LongjackShortDescription=Complete notes
LongjackDescription=A jack, or jackhammer, is a tool that is continuously driven in a circular motion. A longjack is the same size, but is slightly longer.\n\nThe length of a jack considered a longjack is variable, but is usually around 5-6 inches. A longjack can be continuously driven to the end.\n\nLongjacks are the basic model based on continuous jacks, hand jacks, or spring jacks. This basic model also makes up most of the construction of custom files with a vibro style of play.
Anchor=Foreign
AnchorShortDescription=Basically, long jacks mounted
AnchorDescription=An anchor is a set of nodes that share common continuity with respect to other nodes in a sequence. Very rarely, the anchor is only one arrow at a time.\n\nThe anchor can be on the snap moving away from the rest of the pattern or not, or a bit of both. Anchors that last a while are bent to become longjacks, which makes an overall pattern more energy efficient.\n\nThe picture on the right shows the bridge at the fourth pole.
Minedodge=My experience
MinedodgeShortDescription=Sauce Notes
MinedodgeDescription=Minedodge is the term for a general type of board or board that includes samples deliberately placed near mines to increase the difficulty.\n\nMinedodge doesn't actually change the MSD of a trace, because the calculator deals with the problem of density features.\n\nThe problem with mine-dodge comes from the need for more precise timing of press and release samples and increased difficulty reading samples depending on the sample format used.
Hold=eye
HoldShortDescription=Don't let him go
HoldDescription=Holds are a type of variation that requires the player to hold the mouse for the entire duration of the variation. They can also be referred to as freezes or long tones.\n\nPatterns made up of more stops are sometimes referred to as oblique or, at the end of the line, fully oblique (the entire linear space is blank).\n\nIn this game, a pause can be issued for a certain amount of time: 250ms. Holds can then be taken. Holds have no release time, but release time can be measured by climbing or mine.
Rolld=collapse / collapse
RolldShortDescription=Keep holding
RolldDescription=Overlay types, not to be confused with overhead types, are blocking types that require the player to continuously press a button for the duration of the round. They can also be referred to as rolld.\nRolls cannot be held and must be held continuously. The default setting includes a threshold that the player does not gain judgment on, and 500ms on all judgment difficulties.
Burst=bust
BurstShortDescription=Burst speed
BurstDescription=Burst is a pattern classification that says exactly what it says. Compared to its reverse order, the profile is much smaller.\n\nBursts can come in any shape that matches that definition, not just the scenario pictured on the right. The jacks and jumpstream can also be separated. The point is that it’s a slow collection of emotions, almost like a sharpened knife.\n\nOften, the package is set up in such a way that it is not difficult to complete the combo. But that’s not always the case!
Polyrhythm=Lots of rhythm
PolyrhythmShortDescription=Brain checkpoints
PolyrhythmDescription=Polyrhythms are a special set of rhythms that means multiple rhythms are performed simultaneously, resulting in the use of a common message. Sometimes the result of this is a frustrating process that is difficult to implement properly.\n\nOn the right is the insert for a pair of 16 and 12 frets.
Graces=Useful / Flames
GracesShortDescription=A little extra heat
GracesDescription=Lucky coins are slightly twisted coins, with the exception of minijacks, which represent a kind of bonus or extra magic to the primary coin.\n\nIn music theory, these are labeled as not necessary, but usually when these are included, it means that there is a presence of grace in the music.\n\nFlames are excellent. Within this game, both usually mean the same thing. Graces are usually clustered together as a single nodule, and rarely can have separate nodules.
Runningman=A running man
RunningmanShortDescription=Enclosed River
RunningmanDescription=Classically, runningman referred to a flowing river. We extended that description by allowing the vibrations to blend into it very lightly. A guided jumpstream can technically have a person running, but it can only be referred to as a guided jumpstream.\n\nThe bowl in a runningman should be spaced out from the rest of the board so that it doesn’t form chords with the rest of the board.\n\nTo the right is a runner positioned around deck 1. Deck pieces can be on any deck, but there must be as many boats on the same arm as the deck.
